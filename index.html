<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:            #0a0a0a;
      --surface:       rgba(255,255,255,0.055);
      --surface-hover: rgba(255,255,255,0.085);
      --border:        rgba(255,255,255,0.10);
      --border-focus:  rgba(255,255,255,0.30);
      --text-primary:  rgba(255,255,255,0.92);
      --text-muted:    rgba(255,255,255,0.42);
      --text-dim:      rgba(255,255,255,0.20);
      --glow-focus:    rgba(255,255,255,0.10);
      --accent:        rgba(138,180,248,0.85);
      --danger:        rgba(255,80,80,0.90);
      --pill:          9999px;
      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bot:      env(safe-area-inset-bottom, 0px);
    }

    html {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #wallpaperLayer {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: local;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    #wallpaperLayer.loaded { opacity: 1; }

    #wallpaperDim {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background: rgba(0,0,0,0.45);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      will-change: opacity;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }
    #wallpaperDim.loaded { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    #menuBtn {
      position: fixed;
      top: calc(var(--safe-top) + 12px); right: 16px; z-index: 60;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(10,10,10,0.60);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted); padding: 0;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: color 0.2s, background 0.2s;
    }
    #menuBtn:active { color: var(--text-primary); background: rgba(40,40,40,0.80); }
    #menuBtn svg { width: 20px; height: 20px; }

    #dropMenu {
      position: fixed;
      top: calc(var(--safe-top) + 60px); right: 16px; z-index: 61;
      background: rgba(22,22,22,0.96);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 6px; display: flex; flex-direction: column; gap: 2px;
      min-width: 200px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.70);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      opacity: 0; pointer-events: none;
      transform: scale(0.92) translateY(-10px); transform-origin: top right;
      will-change: transform, opacity;
      transition: opacity 0.20s ease, transform 0.20s cubic-bezier(0.22,1,0.36,1);
    }
    #dropMenu.open { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); }
    .drop-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; border-radius: 11px;
      cursor: pointer; font-size: 15px; font-weight: 400;
      color: var(--text-primary); background: transparent; border: none;
      width: 100%; text-align: left; font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: background 0.15s;
    }
    .drop-item:active { background: var(--surface-hover); }
    .drop-item svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--text-muted); }

    #scrollRoot {
      position: relative; z-index: 2;
      height: 100%; width: 100%;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-top: calc(var(--safe-top) + 64px);
      padding-bottom: calc(var(--safe-bot) + 32px);
      padding-left: 16px; padding-right: 16px;
      scrollbar-width: none;
    }
    #scrollRoot::-webkit-scrollbar { display: none; }

    .page {
      display: flex; flex-direction: column; align-items: center; width: 100%;
      animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) both;
    }

    .clock-wrapper {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin-bottom: 28px;
      animation: fadeUp 0.55s 0.04s cubic-bezier(0.22,1,0.36,1) both;
    }
    .clock {
      font-family: 'JetBrains Mono', monospace; font-weight: 300;
      font-size: clamp(64px, 20vw, 100px);
      letter-spacing: -0.04em; line-height: 1;
      color: var(--text-primary);
      text-shadow: 0 2px 8px rgba(0,0,0,0.70);
      font-variant-numeric: tabular-nums;
      display: flex; align-items: baseline;
    }
    .clock-sep { animation: blink 1s step-start infinite; margin: 0 2px; }
    .clock-ampm {
      font-size: clamp(16px, 4.5vw, 24px); font-weight: 300;
      letter-spacing: 0.06em; color: var(--text-muted);
      align-self: flex-end; margin-bottom: 0.12em; margin-left: 6px;
    }
    .date-label {
      font-weight: 300; font-size: clamp(11px, 3vw, 13px);
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted);
    }

    .search-section {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px; width: 100%;
      animation: fadeUp 0.55s 0.10s cubic-bezier(0.22,1,0.36,1) both;
    }
    .engine-row {
      display: flex; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      width: 100%; gap: 4px; padding-bottom: 2px;
      -webkit-mask-image: linear-gradient(to right,transparent 0%,black 5%,black 95%,transparent 100%);
      mask-image: linear-gradient(to right,transparent 0%,black 5%,black 95%,transparent 100%);
    }
    .engine-row::-webkit-scrollbar { display: none; }
    .engine-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: var(--pill);
      border: 1px solid transparent; background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13px; font-weight: 400; letter-spacing: 0.02em;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
    }
    .engine-btn .eng-icon { width: 15px; height: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .engine-btn .eng-icon svg { width: 15px; height: 15px; display: block; }
    .engine-btn:active { color: rgba(255,255,255,0.70); background: var(--surface-hover); }
    .engine-btn.active { color: var(--text-primary); background: rgba(255,255,255,0.08); border-color: var(--border-focus); }

    .search-bar-wrap { position: relative; width: 100%; }
    .search-bar { position: relative; width: 100%; display: flex; align-items: center; }
    .search-badge {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 8px;
      pointer-events: none; z-index: 2; height: 24px;
    }
    .badge-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .badge-icon svg { width: 18px; height: 18px; display: block; }
    .badge-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
    .search-input {
      width: 100%; height: 54px; padding: 0 52px 0 52px;
      border-radius: var(--pill); border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px; font-weight: 300;
      outline: none; appearance: none; -webkit-appearance: none;
      caret-color: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 6px 24px rgba(0,0,0,0.50);
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      user-select: text; -webkit-user-select: text;
    }
    .search-input::placeholder { color: var(--text-muted); font-weight: 300; }
    .search-input:focus {
      border-color: var(--border-focus); background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px var(--glow-focus), inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 24px rgba(0,0,0,0.50);
    }
    .search-submit {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: color 0.2s, background 0.2s;
    }
    .search-submit svg { width: 18px; height: 18px; stroke-width: 2; }
    .search-submit:active { color: var(--text-primary); background: rgba(255,255,255,0.10); }

    .recent-section { width: 100%; margin-top: 22px; animation: fadeUp 0.55s 0.14s cubic-bezier(0.22,1,0.36,1) both; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
    .section-label { font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-dim); font-weight: 400; }
    .section-clear { font-size: 11px; color: var(--text-muted); background: none; border: none; cursor: pointer; font-family: 'Inter', sans-serif; padding: 4px 8px; border-radius: 8px; -webkit-tap-highlight-color: transparent; transition: color 0.15s, background 0.15s; }
    .section-clear:active { color: var(--danger); background: rgba(255,80,80,0.08); }
    .recent-inline-list { display: flex; flex-direction: column; gap: 1px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .recent-inline-empty { padding: 18px 16px; font-size: 13px; color: var(--text-dim); text-align: center; }
    .recent-inline-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background 0.10s; }
    .recent-inline-item:last-child { border-bottom: none; }
    .recent-inline-item:active { background: var(--surface-hover); }
    .recent-inline-icon { flex-shrink: 0; width: 17px; height: 17px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    .recent-inline-icon svg { width: 14px; height: 14px; }
    .recent-inline-text { flex: 1; font-size: 14px; font-weight: 300; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-inline-del { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-dim); -webkit-tap-highlight-color: transparent; transition: color 0.12s, background 0.12s; }
    .recent-inline-del:active { color: var(--danger); background: rgba(255,80,80,0.10); }
    .recent-inline-del svg { width: 11px; height: 11px; }

    .shortcuts-section { width: 100%; margin-top: 22px; animation: fadeUp 0.55s 0.18s cubic-bezier(0.22,1,0.36,1) both; }
    .shortcuts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 16px 12px; width: 100%; }
    .shortcut-item { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; position: relative; -webkit-tap-highlight-color: transparent; touch-action: manipulation; animation: popIn 0.25s cubic-bezier(0.22,1,0.36,1) both; }
    .shortcut-icon { width: 54px; height: 54px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; transition: transform 0.15s, border-color 0.15s, background 0.15s; box-shadow: 0 4px 16px rgba(0,0,0,0.40); }
    .shortcut-item:active .shortcut-icon { transform: scale(0.91); }
    .shortcut-icon img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; display: block; }
    .shortcut-icon .shortcut-letter { font-size: 22px; font-weight: 500; color: var(--text-primary); line-height: 1; text-transform: uppercase; }
    .shortcut-label { font-size: 11px; font-weight: 400; color: var(--text-muted); text-align: center; max-width: 72px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shortcut-del-btn { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 2; -webkit-tap-highlight-color: transparent; }
    .shortcut-del-btn svg { width: 8px; height: 8px; stroke: #fff; stroke-width: 2.5; }
    .shortcuts-grid.edit-mode .shortcut-del-btn { display: flex; }
    .shortcuts-grid.edit-mode .shortcut-icon { animation: shortcutWiggle 0.5s ease infinite alternate; }
    @keyframes shortcutWiggle { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
    .shortcuts-grid.edit-mode .shortcut-item:active .shortcut-icon { animation: none; transform: scale(0.91); }
    .shortcut-add { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .shortcut-add-icon { width: 54px; height: 54px; border-radius: 16px; background: transparent; border: 1.5px dashed rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; transition: border-color 0.18s, background 0.18s; }
    .shortcut-add:active .shortcut-add-icon { border-color: rgba(255,255,255,0.40); background: var(--surface); }
    .shortcut-add-icon svg { width: 20px; height: 20px; color: rgba(255,255,255,0.22); }
    .shortcut-add-label { font-size: 11px; color: rgba(255,255,255,0.22); text-align: center; }

    /* ── Chat ── */
    .chat-section {
      width: 100%; margin-top: 26px;
      animation: fadeUp 0.55s 0.22s cubic-bezier(0.22,1,0.36,1) both;
      display: flex; flex-direction: column;
    }

    /* Small header row: label left, toggle right */
    .chat-header-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 8px; padding: 0 2px;
    }
    .chat-header-left {
      display: flex; align-items: center; gap: 8px;
    }
    .chat-status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(100,220,100,0.80);
      box-shadow: 0 0 6px rgba(100,220,100,0.60);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .chat-status-dot.offline {
      background: rgba(255,255,255,0.20); box-shadow: none;
    }
    .chat-username-display {
      font-size: 11px; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 400;
      cursor: pointer; padding: 3px 6px; border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, background 0.15s;
      user-select: none; -webkit-user-select: none;
    }
    .chat-username-display:active {
      color: var(--text-primary); background: var(--surface-hover);
    }

    /* Slim toggle — pill shape, no label */
    .chat-mini-toggle {
      position: relative; width: 42px; height: 24px;
      flex-shrink: 0; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-mini-toggle input {
      opacity: 0; width: 0; height: 0; position: absolute;
    }
    .chat-mini-track {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: background 0.25s, border-color 0.25s;
    }
    .chat-mini-toggle input:checked ~ .chat-mini-track {
      background: rgba(100,220,100,0.85);
      border-color: rgba(100,220,100,0.60);
    }
    .chat-mini-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
      transition: transform 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .chat-mini-toggle input:checked ~ .chat-mini-thumb {
      transform: translateX(18px);
    }

    .chat-body {
      display: flex; flex-direction: column;
      overflow: hidden; max-height: 0; opacity: 0;
      transition: max-height 0.40s cubic-bezier(0.22,1,0.36,1), opacity 0.30s ease;
    }
    .chat-body.visible { max-height: 600px; opacity: 1; }

    .chat-messages {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px 18px 0 0;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      overflow-y: auto; overflow-x: hidden;
      height: 260px; display: flex; flex-direction: column;
      padding: 12px 0 4px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 3px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .chat-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: var(--text-dim); font-size: 13px; padding: 24px;
    }
    .chat-empty svg { width: 28px; height: 28px; opacity: 0.4; }

    .chat-msg {
      display: flex; flex-direction: column;
      padding: 4px 14px; gap: 2px;
      animation: fadeUp 0.20s cubic-bezier(0.22,1,0.36,1) both;
    }
    .chat-msg-header { display: flex; align-items: baseline; gap: 7px; }
    .chat-msg-name { font-size: 11px; font-weight: 500; color: var(--accent); letter-spacing: 0.03em; flex-shrink: 0; }
    .chat-msg-name.self { color: rgba(180,255,180,0.75); }
    .chat-msg-time { font-size: 10px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
    .chat-msg-text { font-size: 14px; font-weight: 300; color: var(--text-primary); line-height: 1.5; word-break: break-word; user-select: text; -webkit-user-select: text; }
    .chat-msg-text a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(138,180,248,0.35); transition: color 0.15s, border-color 0.15s; word-break: break-all; }
    .chat-msg-text a:active { color: rgba(138,180,248,1); border-color: rgba(138,180,248,0.8); }

    .chat-input-row {
      display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 18px 18px;
      overflow: hidden;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .chat-text-input {
      flex: 1; height: 50px; padding: 0 14px;
      background: none; border: none; outline: none;
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px; font-weight: 300;
      caret-color: var(--accent);
      appearance: none; -webkit-appearance: none;
      user-select: text; -webkit-user-select: text; min-width: 0;
    }
    .chat-text-input::placeholder { color: var(--text-dim); }
    .chat-clear-btn {
      flex-shrink: 0; width: 50px; height: 50px;
      background: none; border: none; border-left: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-dim);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: color 0.15s, background 0.15s;
    }
    .chat-clear-btn:active { color: var(--danger); background: rgba(255,80,80,0.08); }
    .chat-clear-btn svg { width: 17px; height: 17px; }
    .chat-send-btn {
      flex-shrink: 0; width: 50px; height: 50px;
      background: none; border: none; border-left: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-dim);
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      transition: color 0.15s, background 0.15s;
    }
    .chat-send-btn:active { color: var(--accent); background: rgba(138,180,248,0.08); }
    .chat-send-btn svg { width: 18px; height: 18px; }

    .confirm-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }
    .confirm-backdrop.open { opacity: 1; pointer-events: all; }
    .confirm-box { background: #1a1a1a; border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px 20px; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 16px; transform: scale(0.90); transition: transform 0.20s cubic-bezier(0.22,1,0.36,1); }
    .confirm-backdrop.open .confirm-box { transform: scale(1); }
    .confirm-icon { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.22); display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    .confirm-icon svg { width: 22px; height: 22px; color: var(--danger); }
    .confirm-title { font-size: 17px; font-weight: 500; color: var(--text-primary); text-align: center; }
    .confirm-body { font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.5; }
    .confirm-actions { display: flex; gap: 8px; }

    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; touch-action: none; will-change: opacity; }
    .sheet-backdrop.open { opacity: 1; pointer-events: all; }
    .sheet { background: #181818; border: 1px solid var(--border); border-radius: 24px 24px 0 0; width: 100%; max-height: 92svh; padding: 20px 18px calc(var(--safe-bot) + 20px); display: flex; flex-direction: column; gap: 14px; transform: translateY(100%); transition: transform 0.30s cubic-bezier(0.22,1,0.36,1); overflow: hidden; touch-action: pan-y; will-change: transform; }
    .sheet-backdrop.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.14); border-radius: 2px; margin: 0 auto -2px; flex-shrink: 0; }
    .sheet-title { font-size: 17px; font-weight: 500; color: var(--text-primary); flex-shrink: 0; }
    .sheet-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn { flex: 1; height: 50px; border-radius: 14px; border: none; font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: transform 0.12s, background 0.15s; will-change: transform; }
    .btn:active { transform: scale(0.96); }
    .btn-cancel { background: rgba(255,255,255,0.07); color: var(--text-muted); }
    .btn-cancel:active { background: rgba(255,255,255,0.12); }
    .btn-apply { background: rgba(138,180,248,0.18); color: var(--accent); border: 1px solid rgba(138,180,248,0.28); }
    .btn-apply:active { background: rgba(138,180,248,0.28); }
    .btn-apply:disabled { opacity: 0.38; }
    .btn-clear { background: rgba(255,80,80,0.12); color: var(--danger); border: 1px solid rgba(255,80,80,0.22); }
    .btn-clear:active { background: rgba(255,80,80,0.22); }

    .wp-field { display: flex; flex-direction: column; gap: 6px; }
    .wp-field-label { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-dim); font-weight: 400; }
    .wp-url-input { width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 300; outline: none; appearance: none; -webkit-appearance: none; caret-color: var(--accent); transition: border-color 0.2s, background 0.2s; user-select: text; -webkit-user-select: text; }
    .wp-url-input::placeholder { color: var(--text-dim); }
    .wp-url-input:focus { border-color: var(--border-focus); background: rgba(255,255,255,0.07); }
    .wp-saved-label { font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-dim); font-weight: 400; flex-shrink: 0; }
    .wp-saved-urls { display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; -webkit-mask-image: linear-gradient(to right,transparent 0%,black 4%,black 96%,transparent 100%); mask-image: linear-gradient(to right,transparent 0%,black 4%,black 96%,transparent 100%); }
    .wp-saved-urls::-webkit-scrollbar { display: none; }
    .wp-saved-urls:empty { display: none; }
    .wp-saved-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 12px; border-radius: var(--pill); border: 1px solid var(--border); background: rgba(255,255,255,0.04); flex-shrink: 0; max-width: 200px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: border-color 0.15s, background 0.15s; }
    .wp-saved-chip:active { background: var(--surface-hover); }
    .wp-saved-chip-label { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .wp-saved-chip-del { flex-shrink: 0; background: none; border: none; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; -webkit-tap-highlight-color: transparent; padding: 2px; transition: color 0.15s; }
    .wp-saved-chip-del:active { color: var(--danger); }
    .wp-saved-chip-del svg { width: 10px; height: 10px; }
    .wp-preview { flex-shrink: 0; width: 100%; height: 120px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
    .wp-preview img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.3s ease; }
    .wp-preview img.loaded { opacity: 1; }
    .wp-preview-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-dim); font-size: 12px; pointer-events: none; }
    .wp-preview-placeholder svg { width: 28px; height: 28px; }

    .sc-field { display: flex; flex-direction: column; gap: 6px; }
    .sc-label { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-dim); font-weight: 400; }
    .sc-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 300; outline: none; appearance: none; -webkit-appearance: none; caret-color: var(--accent); transition: border-color 0.2s, background 0.2s; user-select: text; -webkit-user-select: text; }
    .sc-input::placeholder { color: var(--text-dim); }
    .sc-input:focus { border-color: var(--border-focus); background: rgba(255,255,255,0.07); }
    .sc-preview-row { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); flex-shrink: 0; }
    .sc-preview-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .sc-preview-icon img { width: 26px; height: 26px; object-fit: contain; border-radius: 4px; }
    .sc-preview-icon .sc-preview-letter { font-size: 20px; font-weight: 500; color: var(--text-primary); text-transform: uppercase; }
    .sc-preview-info { display: flex; flex-direction: column; gap: 3px; }
    .sc-preview-name { font-size: 15px; font-weight: 400; color: var(--text-primary); }
    .sc-preview-url  { font-size: 12px; color: var(--text-muted); word-break: break-all; }

    .toast { position: fixed; bottom: calc(var(--safe-bot) + 28px); left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(28,28,28,0.96); border: 1px solid var(--border); color: var(--text-primary); font-size: 14px; padding: 11px 22px; border-radius: var(--pill); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s cubic-bezier(0.22,1,0.36,1); will-change: transform, opacity; z-index: 400; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100vw - 32px); text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="wallpaperLayer"></div>
<div id="wallpaperDim"></div>

<button id="menuBtn" aria-label="Open menu" aria-haspopup="true" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <circle cx="12" cy="5"  r="1.8"/>
    <circle cx="12" cy="12" r="1.8"/>
    <circle cx="12" cy="19" r="1.8"/>
  </svg>
</button>

<div id="dropMenu" role="menu">
  <button class="drop-item" id="dropWallpaper" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <path d="M21 15l-5-5L5 21"/>
    </svg>
    Change Wallpaper
  </button>
  <button class="drop-item" id="dropShortcuts" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/>
      <rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/>
      <rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg>
    Edit Shortcuts
  </button>
</div>

<div id="scrollRoot">
  <main class="page" role="main">
    <div class="clock-wrapper">
      <div class="clock" id="clock" aria-live="polite" aria-label="Current time">
        <span id="hrs">12</span><span class="clock-sep" aria-hidden="true">:</span><span id="mins">00</span>
        <span class="clock-ampm" id="ampm">AM</span>
      </div>
      <div class="date-label" id="date"></div>
    </div>

    <section class="search-section" aria-label="Web search">
      <div class="engine-row" id="engineRow" role="group" aria-label="Choose search engine"></div>
      <div class="search-bar-wrap">
        <div class="search-bar">
          <div class="search-badge" aria-hidden="true">
            <div class="badge-icon" id="badgeIcon"></div>
            <div class="badge-sep"></div>
          </div>
          <input class="search-input" id="searchInput"
            type="search" inputmode="search"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
            placeholder="Search the web…" aria-label="Search query" enterkeyhint="search"/>
          <button class="search-submit" id="searchSubmit" aria-label="Submit search" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="16.5" y1="16.5" x2="22" y2="22"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <section class="recent-section" id="recentSection" aria-label="Recent searches">
      <div class="section-header">
        <span class="section-label">Recent</span>
        <button class="section-clear" id="recentClearAll" type="button">Clear all</button>
      </div>
      <div class="recent-inline-list" id="recentInlineList"></div>
    </section>

    <section class="shortcuts-section" id="shortcutsSection" aria-label="Shortcuts">
      <div class="section-header">
        <span class="section-label">Shortcuts</span>
      </div>
      <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </section>

    <!-- Chat: small header row with status dot, username, and mini toggle -->
    <section class="chat-section" id="chatSection" aria-label="Live chat">
      <div class="chat-header-row">
        <div class="chat-header-left">
          <div class="chat-status-dot offline" id="chatStatusDot"></div>
          <span class="section-label">Live Chat</span>
          <span class="chat-username-display" id="chatUsernameDisplay" title="Tap to change name">—</span>
        </div>
        <label class="chat-mini-toggle" aria-label="Toggle live chat">
          <input type="checkbox" id="chatToggleInput" />
          <div class="chat-mini-track"></div>
          <div class="chat-mini-thumb"></div>
        </label>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            No messages yet
          </div>
        </div>
        <div class="chat-input-row">
          <input class="chat-text-input" id="chatInput"
            type="text" placeholder="Message everyone…"
            autocomplete="off" autocorrect="off" autocapitalize="sentences"
            spellcheck="false" enterkeyhint="send" maxlength="500"/>
          <button class="chat-clear-btn" id="chatClearBtn" type="button" aria-label="Clear chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
          </button>
          <button class="chat-send-btn" id="chatSendBtn" type="button" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Wallpaper Sheet -->
<div class="sheet-backdrop" id="wpBackdrop" role="dialog" aria-modal="true" aria-label="Change wallpaper">
  <div class="sheet" id="wpSheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Wallpaper</p>
    <div class="wp-preview" id="wpPreview">
      <div class="wp-preview-placeholder" id="wpPreviewPlaceholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        Preview
      </div>
      <img id="wpPreviewImg" src="" alt="Wallpaper preview" />
    </div>
    <div class="wp-field">
      <label class="wp-field-label" for="wpUrlInput">Image URL</label>
      <input class="wp-url-input" id="wpUrlInput" type="text"
        placeholder="https://example.com/image.jpg"
        inputmode="url" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" enterkeyhint="go"/>
    </div>
    <span class="wp-saved-label" id="wpSavedLabel" style="display:none">Recent</span>
    <div class="wp-saved-urls" id="wpSavedUrls"></div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="wpCancel" type="button">Cancel</button>
      <button class="btn btn-clear"  id="wpClear"  type="button">Clear</button>
      <button class="btn btn-apply"  id="wpApply"  type="button" disabled>Apply</button>
    </div>
  </div>
</div>

<!-- Shortcut Sheet -->
<div class="sheet-backdrop" id="scBackdrop" role="dialog" aria-modal="true" aria-label="Add shortcut">
  <div class="sheet" id="scSheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title" id="scSheetTitle">Add Shortcut</p>
    <div class="sc-preview-row">
      <div class="sc-preview-icon" id="scPreviewIcon">
        <span class="sc-preview-letter" id="scPreviewLetter">?</span>
      </div>
      <div class="sc-preview-info">
        <div class="sc-preview-name" id="scPreviewName">Enter a URL</div>
        <div class="sc-preview-url"  id="scPreviewUrl">—</div>
      </div>
    </div>
    <div class="sc-field">
      <label class="sc-label" for="scUrlInput">URL</label>
      <input class="sc-input" id="scUrlInput" type="text"
        placeholder="https://example.com"
        inputmode="url" autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false" enterkeyhint="next"/>
    </div>
    <div class="sc-field">
      <label class="sc-label" for="scNameInput">Name <span style="color:var(--text-dim)">(optional)</span></label>
      <input class="sc-input" id="scNameInput" type="text"
        placeholder="Auto-detected from URL"
        autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"/>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-cancel" id="scCancel" type="button">Cancel</button>
      <button class="btn btn-apply"  id="scSave"   type="button" disabled>Save</button>
    </div>
  </div>
</div>

<!-- Confirm Clear -->
<div class="confirm-backdrop" id="confirmBackdrop" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
    </div>

    <div class="confirm-actions">
      <button class="btn btn-cancel" id="confirmNo"  type="button">Cancel</button>
      <button class="btn btn-clear"  id="confirmYes" type="button">Clear Chat</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite" role="status"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, push, remove,
    onChildAdded, onChildRemoved, onValue,
    serverTimestamp, query, limitToLast
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyAM6T2eWpeqBd5XzcQNa2SGtCsovn_BxAM",
    authDomain:        "citric-143b9.firebaseapp.com",
    databaseURL:       "https://citric-143b9-default-rtdb.firebaseio.com",
    projectId:         "citric-143b9",
    storageBucket:     "citric-143b9.firebasestorage.app",
    messagingSenderId: "75119245524",
    appId:             "1:75119245524:web:d0006197a335457eb52341"
  };

  const app         = initializeApp(firebaseConfig);
  const db          = getDatabase(app);
  const messagesRef = ref(db, 'chat/messages');

  /* ══ Wallpaper size lock ══ */
  const wallLayer = document.getElementById('wallpaperLayer');
  const wallDim   = document.getElementById('wallpaperDim');
  function lockWallpaperSize() {
    const w = window.screen.width  + 'px';
    const h = window.screen.height + 'px';
    wallLayer.style.width  = w; wallLayer.style.height = h;
    wallDim.style.width    = w; wallDim.style.height   = h;
  }
  lockWallpaperSize();
  window.addEventListener('orientationchange', () => setTimeout(lockWallpaperSize, 200));

  function applyWallpaper(url) {
    if (!url) {
      wallLayer.style.backgroundImage = '';
      wallLayer.classList.remove('loaded'); wallDim.classList.remove('loaded');
      try { localStorage.removeItem('wallpaperUrl'); } catch(e) {}
      return;
    }
    const img = new Image();
    img.onload = () => { wallLayer.style.backgroundImage = `url("${url}")`; wallLayer.classList.add('loaded'); wallDim.classList.add('loaded'); };
    img.onerror = () => showToast('Could not load wallpaper image');
    img.src = url;
    try { localStorage.setItem('wallpaperUrl', url); } catch(e) {}
  }
  try { const u = localStorage.getItem('wallpaperUrl'); if (u) applyWallpaper(u); } catch(e) {}

  /* ══ Toast ══ */
  const toastEl = document.getElementById('toast');
  const toastQ  = []; let toastBusy = false;
  function processToastQ() {
    if (!toastQ.length) { toastBusy = false; return; }
    toastBusy = true; toastEl.textContent = toastQ.shift(); toastEl.classList.add('show');
    setTimeout(() => { toastEl.classList.remove('show'); setTimeout(processToastQ, 220); }, 2200);
  }
  function showToast(msg) { toastQ.push(msg); if (!toastBusy) processToastQ(); }

  /* ══ Clock ══ */
  const hrsEl = document.getElementById('hrs'), minsEl = document.getElementById('mins');
  const ampmEl = document.getElementById('ampm'), dateEl = document.getElementById('date');
  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad(n) { return String(n).padStart(2,'0'); }
  function tick() {
    const now = new Date(), pm = now.getHours() >= 12;
    hrsEl.textContent  = pad(now.getHours() % 12 || 12);
    minsEl.textContent = pad(now.getMinutes());
    ampmEl.textContent = pm ? 'PM' : 'AM';
    dateEl.textContent = DAYS[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate();
  }
  tick();
  (() => { const now = new Date(); setTimeout(() => { tick(); setInterval(tick, 60000); }, (60 - now.getSeconds()) * 1000 - now.getMilliseconds()); })();

  /* ══ Wallpaper Sheet ══ */
  const WP_URLS_KEY = 'savedWpUrls', WP_URLS_MAX = 8;
  const loadSavedWpUrls  = () => { try { return JSON.parse(localStorage.getItem(WP_URLS_KEY) || '[]'); } catch(e) { return []; } };
  const saveSavedWpUrls  = a  => { try { localStorage.setItem(WP_URLS_KEY, JSON.stringify(a.slice(-WP_URLS_MAX))); } catch(e) {} };
  const addSavedWpUrl    = u  => { const a = loadSavedWpUrls().filter(x => x !== u); a.push(u); saveSavedWpUrls(a); };
  const removeSavedWpUrl = u  => saveSavedWpUrls(loadSavedWpUrls().filter(x => x !== u));

  const wpBackdrop           = document.getElementById('wpBackdrop');
  const wpSheet              = document.getElementById('wpSheet');
  const wpUrlInput           = document.getElementById('wpUrlInput');
  const wpApply              = document.getElementById('wpApply');
  const wpClear              = document.getElementById('wpClear');
  const wpCancel             = document.getElementById('wpCancel');
  const wpSavedUrlsEl        = document.getElementById('wpSavedUrls');
  const wpSavedLabel         = document.getElementById('wpSavedLabel');
  const wpPreviewImg         = document.getElementById('wpPreviewImg');
  const wpPreviewPlaceholder = document.getElementById('wpPreviewPlaceholder');
  let wpPreviewTimer = null;

  function updateWpPreview(url) {
    clearTimeout(wpPreviewTimer);
    if (!url) { wpPreviewImg.classList.remove('loaded'); wpPreviewImg.src = ''; wpPreviewPlaceholder.style.display = 'flex'; wpApply.disabled = true; return; }
    wpApply.disabled = false;
    wpPreviewTimer = setTimeout(() => {
      wpPreviewImg.classList.remove('loaded'); wpPreviewPlaceholder.style.display = 'flex';
      const t = new Image(); t.onload = () => { wpPreviewImg.src = url; wpPreviewImg.onload = () => { wpPreviewImg.classList.add('loaded'); wpPreviewPlaceholder.style.display = 'none'; }; }; t.onerror = () => {}; t.src = url;
    }, 600);
  }
  function renderSavedWpUrls() {
    wpSavedUrlsEl.innerHTML = ''; const saved = loadSavedWpUrls().slice().reverse();
    wpSavedLabel.style.display = saved.length ? '' : 'none';
    saved.forEach(url => {
      let label = url; try { label = new URL(url).hostname.replace(/^www\./,''); } catch(e) {}
      if (label.length > 32) label = label.slice(0,30) + '…';
      const chip = document.createElement('div'); chip.className = 'wp-saved-chip'; chip.title = url;
      const lbl = document.createElement('span'); lbl.className = 'wp-saved-chip-label'; lbl.textContent = label;
      const del = document.createElement('button'); del.className = 'wp-saved-chip-del'; del.type = 'button'; del.setAttribute('aria-label','Remove');
      del.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>`;
      del.addEventListener('click', e => { e.stopPropagation(); removeSavedWpUrl(url); renderSavedWpUrls(); });
      chip.append(lbl, del); chip.addEventListener('click', e => { if (del.contains(e.target)) return; wpUrlInput.value = url; updateWpPreview(url); });
      wpSavedUrlsEl.appendChild(chip);
    });
  }
  function openWpSheet() {
    const current = localStorage.getItem('wallpaperUrl') || '';
    wpUrlInput.value = current; wpPreviewImg.classList.remove('loaded'); wpPreviewImg.src = '';
    wpPreviewPlaceholder.style.display = 'flex'; wpApply.disabled = !current;
    if (current) updateWpPreview(current); renderSavedWpUrls(); openSheet(wpBackdrop, () => wpUrlInput.focus());
  }
  wpUrlInput.addEventListener('input', () => { let u = wpUrlInput.value.trim(); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u; updateWpPreview(u); });
  wpUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') wpApply.click(); });
  wpApply.addEventListener('click', () => {
    let url = wpUrlInput.value.trim(); if (!url) { showToast('Enter an image URL first'); return; }
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch(e) { showToast('Invalid URL'); return; }
    addSavedWpUrl(url); applyWallpaper(url); showToast('Wallpaper applied ✓'); closeSheet(wpBackdrop);
  });
  wpClear.addEventListener('click',  () => { applyWallpaper(null); showToast('Wallpaper cleared'); closeSheet(wpBackdrop); });
  wpCancel.addEventListener('click', () => closeSheet(wpBackdrop));
  wpBackdrop.addEventListener('click', e => { if (e.target === wpBackdrop) closeSheet(wpBackdrop); });

  /* ══ Sheet helpers ══ */
  function openSheet(backdrop, cb) { backdrop.classList.add('open'); backdrop.removeAttribute('aria-hidden'); if (cb) setTimeout(cb, 310); }
  function closeSheet(backdrop)    { backdrop.classList.remove('open'); backdrop.setAttribute('aria-hidden','true'); }
  function addSwipeDismiss(sheet, backdrop) {
    let sY = 0, cY = 0, on = false;
    sheet.addEventListener('touchstart', e => { sY = e.touches[0].clientY; cY = sY; on = true; }, { passive: true });
    sheet.addEventListener('touchmove',  e => { if (!on) return; cY = e.touches[0].clientY; const d = cY - sY; if (d > 0) sheet.style.transform = `translateY(${d}px)`; }, { passive: true });
    sheet.addEventListener('touchend',   () => { on = false; const d = cY - sY; sheet.style.transform = ''; if (d > 90) closeSheet(backdrop); });
  }
  addSwipeDismiss(wpSheet, wpBackdrop);

  /* ══ Menu ══ */
  const menuBtn = document.getElementById('menuBtn'), dropMenu = document.getElementById('dropMenu');
  let menuOpen = false;
  function setMenuOpen(on) { menuOpen = on; dropMenu.classList.toggle('open', on); menuBtn.setAttribute('aria-expanded', String(on)); }

  document.addEventListener('click', e => { if (menuOpen && !dropMenu.contains(e.target) && e.target !== menuBtn) setMenuOpen(false); });

  /* ══ Recent ══ */
  const RECENT_KEY = 'recentSearches', RECENT_MAX = 12, RECENT_SHOW = 5;
  const loadRecent  = ()   => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(e) { return []; } };
  const saveRecent  = arr  => { try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch(e) {} };
  const addRecent   = term => { if (!term.trim()) return; const a = loadRecent().filter(t => t.toLowerCase() !== term.toLowerCase()); a.unshift(term); saveRecent(a.slice(0, RECENT_MAX)); };
  const rmRecent    = term => saveRecent(loadRecent().filter(t => t !== term));
  const clearRecent = ()   => saveRecent([]);
  const recentInlineList = document.getElementById('recentInlineList');
  const recentClearAll   = document.getElementById('recentClearAll');

  function renderRecentInline() {
    recentInlineList.innerHTML = '';
    const items = loadRecent().slice(0, RECENT_SHOW);
    if (!items.length) { const e = document.createElement('div'); e.className = 'recent-inline-empty'; e.textContent = 'No recent searches yet'; recentInlineList.appendChild(e); return; }
    items.forEach(term => {
      const row = document.createElement('div'); row.className = 'recent-inline-item'; row.setAttribute('role','button'); row.setAttribute('tabindex','0');
      const icon = document.createElement('div'); icon.className = 'recent-inline-icon';
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>`;
      const txt = document.createElement('span'); txt.className = 'recent-inline-text'; txt.textContent = term;
      const del = document.createElement('button'); del.className = 'recent-inline-del'; del.type = 'button'; del.setAttribute('aria-label', `Remove "${term}"`);
      del.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="2" x2="8" y2="8"/><line x1="8" y1="2" x2="2" y2="8"/></svg>`;
      del.addEventListener('click', e => { e.stopPropagation(); rmRecent(term); renderRecentInline(); });
      row.addEventListener('click', e => { if (del.contains(e.target)) return; searchInputEl.value = term; doSearch(); });
      row.append(icon, txt, del); recentInlineList.appendChild(row);
    });
  }
  recentClearAll.addEventListener('click', () => { clearRecent(); renderRecentInline(); });

  /* ══ Engines ══ */
  const ENGINES = {

      svg:`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>` },

  };

  let activeEngine = 'google';
  const engineRowEl   = document.getElementById('engineRow');
  const badgeIcon     = document.getElementById('badgeIcon');
  const searchInputEl = document.getElementById('searchInput');
  const searchSubmit  = document.getElementById('searchSubmit');

  function buildEngineRow() {
    engineRowEl.innerHTML = '';
    Object.entries(ENGINES).forEach(([key, eng]) => {
      const btn = document.createElement('button'); btn.className = 'engine-btn' + (key === activeEngine ? ' active' : '');
      btn.dataset.engine = key; btn.setAttribute('aria-pressed', String(key === activeEngine)); btn.type = 'button';
      const iconWrap = document.createElement('span'); iconWrap.className = 'eng-icon'; iconWrap.innerHTML = eng.svg;
      const label = document.createElement('span'); label.textContent = eng.label;
      btn.append(iconWrap, label); engineRowEl.appendChild(btn);
    });
  }
  function setEngine(key) {
    if (!ENGINES[key]) return; activeEngine = key;
    badgeIcon.innerHTML = ENGINES[key].svg;
    searchInputEl.placeholder = 'Search ' + ENGINES[key].label + '…';
    engineRowEl.querySelectorAll('.engine-btn').forEach(btn => { const on = btn.dataset.engine === key; btn.classList.toggle('active', on); btn.setAttribute('aria-pressed', String(on)); });
    try { localStorage.setItem('engine', key); } catch(e) {}
  }
  try { const s = localStorage.getItem('engine'); if (s && ENGINES[s]) activeEngine = s; } catch(e) {}
  buildEngineRow(); setEngine(activeEngine);
  engineRowEl.addEventListener('click', e => { const b = e.target.closest('.engine-btn'); if (b) setEngine(b.dataset.engine); });

  function doSearch() {
    const q = searchInputEl.value.trim(); if (!q) { searchInputEl.focus(); return; }
    addRecent(q); renderRecentInline();
    window.location.href = ENGINES[activeEngine].url(encodeURIComponent(q));

  searchInputEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  searchSubmit.addEventListener('click', doSearch);

  /* ══ Shortcuts ══ */
  const SC_KEY = 'shortcuts', SC_MAX = 20;
  const scGrid     = document.getElementById('shortcutsGrid');
  const scBackdrop = document.getElementById('scBackdrop');
  const scSheet    = document.getElementById('scSheet');
  addSwipeDismiss(scSheet, scBackdrop);
  let scEditMode = false, scEditIndex = -1;

  function loadShortcuts() { try { return JSON.parse(localStorage.getItem(SC_KEY) || '[]'); } catch(e) { return []; } }
  function saveShortcuts(a) { try { localStorage.setItem(SC_KEY, JSON.stringify(a)); } catch(e) {} }
  function getFaviconUrl(url) { try { return `https://www.google.com/s2/favicons?sz=64&domain_url=${encodeURIComponent(new URL(url).origin)}`; } catch(e) { return ''; } }
  function nameFromUrl(url) { try { const h = new URL(url).hostname.replace(/^www\./,''); const p = h.split('.')[0]; return p.charAt(0).toUpperCase() + p.slice(1); } catch(e) { return url; } }

  function renderShortcuts() {
    scGrid.innerHTML = '';
    const list = loadShortcuts();
    list.forEach((sc, i) => {
      const item = document.createElement('div'); item.className = 'shortcut-item'; item.setAttribute('role','link'); item.setAttribute('tabindex','0');
      const icon = document.createElement('div'); icon.className = 'shortcut-icon';
      const favUrl = getFaviconUrl(sc.url);
      if (favUrl) { const img = document.createElement('img'); img.src = favUrl; img.alt = ''; img.onerror = () => { img.remove(); const ltr = document.createElement('span'); ltr.className = 'shortcut-letter'; ltr.textContent = (sc.name || nameFromUrl(sc.url)).charAt(0); icon.appendChild(ltr); }; icon.appendChild(img); }
      else { const ltr = document.createElement('span'); ltr.className = 'shortcut-letter'; ltr.textContent = (sc.name || nameFromUrl(sc.url)).charAt(0); icon.appendChild(ltr); }
      const delBtn = document.createElement('button'); delBtn.className = 'shortcut-del-btn'; delBtn.type = 'button'; delBtn.setAttribute('aria-label','Delete');
      delBtn.innerHTML = `<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="2.5" y1="2.5" x2="7.5" y2="7.5"/><line x1="7.5" y1="2.5" x2="2.5" y2="7.5"/></svg>`;
      delBtn.addEventListener('click', e => { e.stopPropagation(); deleteShortcut(i); });
      const lbl = document.createElement('div'); lbl.className = 'shortcut-label'; lbl.textContent = sc.name || nameFromUrl(sc.url);
      item.append(icon, delBtn, lbl);
      item.addEventListener('click', () => { if (scEditMode) { openScSheet(i); return; } let url = sc.url; if (!/^https?:\/\//i.test(url)) url = 'https://' + url; window.open(url, '_blank', 'noopener'); });
      let lpTimer;
      item.addEventListener('pointerdown',  () => { lpTimer = setTimeout(() => { if (!scEditMode) toggleEditMode(); }, 600); });
      item.addEventListener('pointerup',    () => clearTimeout(lpTimer));
      item.addEventListener('pointerleave', () => clearTimeout(lpTimer));
      scGrid.appendChild(item);
    });
    if (list.length < SC_MAX) {
      const addBtn = document.createElement('div'); addBtn.className = 'shortcut-add'; addBtn.setAttribute('role','button'); addBtn.setAttribute('tabindex','0'); addBtn.setAttribute('aria-label','Add shortcut');
      addBtn.innerHTML = `<div class="shortcut-add-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><span class="shortcut-add-label">Add</span>`;
      addBtn.addEventListener('click', () => openScSheet(-1)); scGrid.appendChild(addBtn);
    }
    scGrid.classList.toggle('edit-mode', scEditMode);
  }

  function deleteShortcut(i) { const list = loadShortcuts(); list.splice(i,1); saveShortcuts(list); renderShortcuts(); showToast('Shortcut removed'); }
  function toggleEditMode() { scEditMode = !scEditMode; scGrid.classList.toggle('edit-mode', scEditMode); showToast(scEditMode ? 'Tap × to remove · tap icon to edit' : 'Done editing'); if (!scEditMode) renderShortcuts(); }

  const scSheetTitle  = document.getElementById('scSheetTitle');
  const scUrlInput    = document.getElementById('scUrlInput');
  const scNameInput   = document.getElementById('scNameInput');
  const scSave        = document.getElementById('scSave');
  const scCancel      = document.getElementById('scCancel');
  const scPreviewIcon = document.getElementById('scPreviewIcon');
  const scPreviewName = document.getElementById('scPreviewName');
  const scPreviewUrl  = document.getElementById('scPreviewUrl');
  let scPreviewTimer  = null;

  function updateScPreview() {
    const rawUrl = scUrlInput.value.trim(), rawName = scNameInput.value.trim();
    let url = rawUrl; if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    scSave.disabled = !rawUrl;
    if (!rawUrl) { scPreviewIcon.innerHTML = '<span class="sc-preview-letter">?</span>'; scPreviewName.textContent = 'Enter a URL'; scPreviewUrl.textContent = '—'; return; }
    const displayName = rawName || nameFromUrl(url); scPreviewName.textContent = displayName; scPreviewUrl.textContent = url;
    const firstChar = displayName.charAt(0).toUpperCase();
    clearTimeout(scPreviewTimer);
    scPreviewTimer = setTimeout(() => {
      const favUrl = getFaviconUrl(url);
      if (favUrl) { const img = new Image(); img.onload = () => { scPreviewIcon.innerHTML = ''; const el = document.createElement('img'); el.src = favUrl; el.alt = ''; scPreviewIcon.appendChild(el); }; img.onerror = () => { scPreviewIcon.innerHTML = `<span class="sc-preview-letter">${firstChar}</span>`; }; img.src = favUrl; }
      else { scPreviewIcon.innerHTML = `<span class="sc-preview-letter">${firstChar}</span>`; }
    }, 500);
  }

  function openScSheet(index) {
    scEditIndex = index; const list = loadShortcuts();
    if (index >= 0 && list[index]) { scSheetTitle.textContent = 'Edit Shortcut'; scUrlInput.value = list[index].url; scNameInput.value = list[index].name || ''; }
    else { scSheetTitle.textContent = 'Add Shortcut'; scUrlInput.value = ''; scNameInput.value = ''; }
    updateScPreview(); openSheet(scBackdrop, () => scUrlInput.focus());
  }
  scUrlInput.addEventListener('input', updateScPreview);
  scNameInput.addEventListener('input', updateScPreview);
  scUrlInput.addEventListener('keydown', e => { if (e.key === 'Enter') scNameInput.focus(); });
  scNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') scSave.click(); });
  scSave.addEventListener('click', () => {
    let url = scUrlInput.value.trim(); const name = scNameInput.value.trim(); if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch(e) { showToast('Invalid URL'); return; }
    const list = loadShortcuts();
    if (scEditIndex >= 0 && list[scEditIndex]) list[scEditIndex] = { url, name };
    else list.push({ url, name });
    saveShortcuts(list); renderShortcuts(); closeSheet(scBackdrop);
    showToast(scEditIndex >= 0 ? 'Shortcut updated ✓' : 'Shortcut added ✓');
  });
  scCancel.addEventListener('click', () => closeSheet(scBackdrop));
  scBackdrop.addEventListener('click', e => { if (e.target === scBackdrop) closeSheet(scBackdrop); });
  document.addEventListener('click', e => { if (scEditMode && !scGrid.contains(e.target) && !scBackdrop.classList.contains('open') && !dropMenu.contains(e.target)) { scEditMode = false; scGrid.classList.remove('edit-mode'); } });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (scBackdrop.classList.contains('open')) closeSheet(scBackdrop);
    else if (wpBackdrop.classList.contains('open')) closeSheet(wpBackdrop);
    else if (scEditMode) { scEditMode = false; scGrid.classList.remove('edit-mode'); }
    else closeConfirm();
  });

  /* ══ Chat ══ */
  const CHAT_ENABLED_KEY    = 'chatEnabled';
  const chatBody            = document.getElementById('chatBody');
  const chatToggleInput     = document.getElementById('chatToggleInput');
  const chatMessagesEl      = document.getElementById('chatMessages');
  const chatInput           = document.getElementById('chatInput');
  const chatSendBtn         = document.getElementById('chatSendBtn');
  const chatClearBtn        = document.getElementById('chatClearBtn');
  const chatStatusDot       = document.getElementById('chatStatusDot');
  const chatUsernameDisplay = document.getElementById('chatUsernameDisplay');

  const renderedKeys = new Set();
  let unsubConnected = null, unsubChildAdded = null, unsubChildRemoved = null;

  const CHAT_USER_KEY = 'chatUsername';
  let myUsername = '';
  try { myUsername = localStorage.getItem(CHAT_USER_KEY) || ''; } catch(e) {}
  if (!myUsername) { myUsername = 'User' + Math.floor(Math.random() * 9000 + 1000); try { localStorage.setItem(CHAT_USER_KEY, myUsername); } catch(e) {} }
  chatUsernameDisplay.textContent = myUsername;
  chatUsernameDisplay.addEventListener('click', () => {
    const n = prompt('Enter your display name:', myUsername);
    if (n && n.trim()) { myUsername = n.trim().slice(0,24); chatUsernameDisplay.textContent = myUsername; try { localStorage.setItem(CHAT_USER_KEY, myUsername); } catch(e) {} showToast('Name updated ✓'); }
  });

  function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function linkify(text) {
    const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return esc.replace(/(https?:\/\/[^\s<>"{}|\\^`[\]]+)/gi, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  }

  function renderEmptyState() {
    if (!chatMessagesEl.querySelector('.chat-empty')) {
      const e = document.createElement('div'); e.className = 'chat-empty';
      e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>No messages yet`;
      chatMessagesEl.appendChild(e);
    }
  }
  function clearChatDOM() { chatMessagesEl.innerHTML = ''; renderedKeys.clear(); renderEmptyState(); }

  function appendMessage(data, key) {
    if (renderedKeys.has(key)) return; renderedKeys.add(key);
    const empty = chatMessagesEl.querySelector('.chat-empty'); if (empty) empty.remove();
    const isSelf = data.name === myUsername;
    const wrap = document.createElement('div'); wrap.className = 'chat-msg'; wrap.dataset.key = key;
    const header = document.createElement('div'); header.className = 'chat-msg-header';
    const name = document.createElement('span'); name.className = 'chat-msg-name' + (isSelf ? ' self' : ''); name.textContent = data.name;
    const time = document.createElement('span'); time.className = 'chat-msg-time'; time.textContent = fmtTime(data.ts);
    header.append(name, time);
    const text = document.createElement('div'); text.className = 'chat-msg-text'; text.innerHTML = linkify(data.text);
    wrap.append(header, text); chatMessagesEl.appendChild(wrap);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function startChatListeners() {
    stopChatListeners();
    unsubConnected = onValue(ref(db, '.info/connected'), snap => {
      const ok = snap.val() === true;
      chatStatusDot.classList.toggle('offline', !ok);
      chatStatusDot.title = ok ? 'Connected' : 'Connecting…';
    });
    const q = query(messagesRef, limitToLast(50));
    unsubChildAdded   = onChildAdded(q, snap => appendMessage(snap.val(), snap.key));
    unsubChildRemoved = onChildRemoved(messagesRef, snap => {
      const el = chatMessagesEl.querySelector(`[data-key="${snap.key}"]`);
      if (el) el.remove(); renderedKeys.delete(snap.key);
      if (!chatMessagesEl.querySelectorAll('.chat-msg').length) renderEmptyState();
    });
  }
  function stopChatListeners() {
    if (unsubConnected)    { unsubConnected();    unsubConnected    = null; }
    if (unsubChildAdded)   { unsubChildAdded();   unsubChildAdded   = null; }
    if (unsubChildRemoved) { unsubChildRemoved(); unsubChildRemoved = null; }
    chatStatusDot.classList.add('offline'); chatStatusDot.title = 'Chat disabled';
  }

  let chatEnabled = false;
  try { chatEnabled = localStorage.getItem(CHAT_ENABLED_KEY) === 'true'; } catch(e) {}
  chatToggleInput.checked = chatEnabled;
  applyChatState(chatEnabled);

  chatToggleInput.addEventListener('change', () => {
    chatEnabled = chatToggleInput.checked;
    try { localStorage.setItem(CHAT_ENABLED_KEY, String(chatEnabled)); } catch(e) {}
    applyChatState(chatEnabled);
    showToast(chatEnabled ? 'Chat enabled' : 'Chat disabled');
  });

  function applyChatState(enabled) {
    if (enabled) { chatBody.classList.add('visible'); clearChatDOM(); startChatListeners(); }
    else { chatBody.classList.remove('visible'); stopChatListeners(); clearChatDOM(); }
  }

  function sendMessage() {
    if (!chatEnabled) { showToast('Enable chat first'); return; }
    const text = chatInput.value.trim(); if (!text) return;
    chatInput.value = '';
    push(messagesRef, { name: myUsername, text, ts: serverTimestamp() })
      .catch(() => showToast('Failed to send — check connection'));
  }
  chatSendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
  chatClearBtn.addEventListener('click', () => openConfirm());

  /* ══ Confirm ══ */
  const confirmBackdrop = document.getElementById('confirmBackdrop');
  const confirmNo       = document.getElementById('confirmNo');
  const confirmYes      = document.getElementById('confirmYes');
  function openConfirm()  { confirmBackdrop.classList.add('open'); }
  function closeConfirm() { confirmBackdrop.classList.remove('open'); }
  confirmNo.addEventListener('click', closeConfirm);
  confirmBackdrop.addEventListener('click', e => { if (e.target === confirmBackdrop) closeConfirm(); });
  confirmYes.addEventListener('click', async () => {
    confirmYes.disabled = true; confirmYes.textContent = 'Clearing…';
    try { clearChatDOM(); await remove(messagesRef); showToast('Chat cleared for everyone ✓'); }
    catch(e) { showToast('Failed to clear — check connection'); }
    finally { confirmYes.disabled = false; confirmYes.textContent = 'Clear Chat'; closeConfirm(); }
  });

  /* ══ Init ══ */
  renderRecentInline();
  renderShortcuts();
</script>
</body>
</html>
