<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:            #0a0a0a;
      --surface:       rgba(255,255,255,0.055);
      --surface-hover: rgba(255,255,255,0.085);
      --border:        rgba(255,255,255,0.10);
      --border-focus:  rgba(255,255,255,0.30);
      --text-primary:  rgba(255,255,255,0.92);
      --text-muted:    rgba(255,255,255,0.42);
      --text-dim:      rgba(255,255,255,0.20);
      --glow-focus:    rgba(255,255,255,0.10);
      --accent:        rgba(138,180,248,0.85);
      --danger:        rgba(255,80,80,0.90);
      --pill:          9999px;
      --safe-top:      env(safe-area-inset-top, 0px);
      --safe-bot:      env(safe-area-inset-bottom, 0px);
    }

    html { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { height: 100%; width: 100%; overflow: hidden; background-color: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text-primary); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

    #wallpaperLayer { position: fixed; inset: 0; z-index: 0; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
    #wallpaperLayer.loaded { opacity: 1; }
    #wallpaperDim { position: fixed; inset: 0; z-index: 1; background: rgba(0,0,0,0.45); opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
    #wallpaperDim.loaded { opacity: 1; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
    @keyframes wiggle { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

    #menuBtn { position: fixed; top: calc(var(--safe-top) + 12px); right: 16px; z-index: 60; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: rgba(10,10,10,0.60); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: color 0.2s, background 0.2s; }
    #menuBtn:active { color: var(--text-primary); background: rgba(40,40,40,0.80); }
    #menuBtn svg { width: 20px; height: 20px; }

    #dropMenu { position: fixed; top: calc(var(--safe-top) + 60px); right: 16px; z-index: 61; background: rgba(22,22,22,0.96); border: 1px solid var(--border); border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-width: 200px; box-shadow: 0 16px 48px rgba(0,0,0,0.70); backdrop-filter: blur(20px); opacity: 0; pointer-events: none; transform: scale(0.92) translateY(-10px); transform-origin: top right; transition: opacity 0.2s, transform 0.2s cubic-bezier(0.22,1,0.36,1); }
    #dropMenu.open { opacity: 1; pointer-events: all; transform: scale(1) translateY(0); }
    .drop-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 11px; cursor: pointer; font-size: 15px; color: var(--text-primary); background: transparent; border: none; width: 100%; text-align: left; transition: background 0.15s; }
    .drop-item:active { background: var(--surface-hover); }
    .drop-item svg { width: 17px; height: 17px; flex-shrink: 0; color: var(--text-muted); }

    #scrollRoot { position: relative; z-index: 2; height: 100%; width: 100%; overflow-y: auto; padding: calc(var(--safe-top) + 64px) 16px calc(var(--safe-bot) + 32px); scrollbar-width: none; }
    #scrollRoot::-webkit-scrollbar { display: none; }

    .page { display: flex; flex-direction: column; align-items: center; width: 100%; animation: fadeUp 0.55s cubic-bezier(0.22,1,0.36,1) both; }

    .clock-wrapper { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 28px; }
    .clock { font-family: 'JetBrains Mono', monospace; font-weight: 300; font-size: clamp(64px, 20vw, 100px); letter-spacing: -0.04em; color: var(--text-primary); text-shadow: 0 2px 8px rgba(0,0,0,0.70); display: flex; align-items: baseline; }
    .clock-sep { animation: blink 1s step-start infinite; margin: 0 2px; }
    .clock-ampm { font-size: clamp(16px, 4.5vw, 24px); color: var(--text-muted); margin-left: 6px; }
    .date-label { font-size: clamp(11px, 3vw, 13px); letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
    .age-display { margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); cursor: pointer; }

    .search-section { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .engine-row { display: flex; overflow-x: auto; width: 100%; gap: 4px; padding-bottom: 2px; scrollbar-width: none; -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent); }
    .engine-row::-webkit-scrollbar { display: none; }
    .engine-btn { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: var(--pill); border: 1px solid transparent; background: transparent; color: var(--text-muted); font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
    .engine-btn.active { color: var(--text-primary); background: rgba(255,255,255,0.08); border-color: var(--border-focus); }
    .eng-icon { width: 15px; height: 15px; display: flex; align-items: center; justify-content: center; }
    .eng-icon img, .eng-icon svg { width: 15px; height: 15px; object-fit: contain; }

    .search-bar-wrap { position: relative; width: 100%; }
    .search-badge { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 2; }
    .badge-icon { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
    .badge-icon img, .badge-icon svg { width: 18px; height: 18px; object-fit: contain; }
    .badge-sep { width: 1px; height: 16px; background: var(--border); }
    .search-input { width: 100%; height: 54px; padding: 0 52px 0 52px; border-radius: var(--pill); border: 1px solid var(--border); background: var(--surface); backdrop-filter: blur(20px); color: var(--text-primary); font-size: 16px; outline: none; caret-color: var(--accent); box-shadow: 0 6px 24px rgba(0,0,0,0.50); transition: all 0.25s; }
    .search-input:focus { border-color: var(--border-focus); background: rgba(255,255,255,0.07); }
    .search-submit { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; border: none; background: transparent; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
    .search-submit:active { color: var(--text-primary); background: var(--surface-hover); }

    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; width: 100%; }
    .section-label { font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--text-dim); }
    .section-clear { font-size: 11px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 8px; }
    .section-clear:active { color: var(--danger); }

    .recent-section { width: 100%; margin-top: 22px; }
    .recent-inline-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
    .recent-inline-item { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s; }
    .recent-inline-item:active { background: var(--surface-hover); }
    .recent-inline-text { flex: 1; font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .shortcuts-section { width: 100%; margin-top: 22px; }
    .shortcuts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 16px 12px; width: 100%; }
    .shortcut-item { display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; position: relative; animation: popIn 0.25s both; }
    .shortcut-icon { width: 54px; height: 54px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.40); transition: transform 0.15s; }
    .shortcut-item:active .shortcut-icon { transform: scale(0.91); }
    .shortcut-icon img { width: 28px; height: 28px; border-radius: 6px; object-fit: contain; }
    .shortcut-letter { font-size: 22px; font-weight: 500; color: var(--text-primary); text-transform: uppercase; }
    .shortcut-label { font-size: 11px; color: var(--text-muted); text-align: center; max-width: 72px; overflow: hidden; text-overflow: ellipsis; }
    .shortcut-del-btn { position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); display: none; align-items: center; justify-content: center; z-index: 2; color: #fff; font-size: 16px; font-weight: bold; line-height: 1; }
    .shortcuts-grid.edit-mode .shortcut-del-btn { display: flex; }
    .shortcuts-grid.edit-mode .shortcut-icon { animation: wiggle 0.3s infinite alternate; }
    .shortcut-add-icon { width: 54px; height: 54px; border-radius: 16px; border: 1.5px dashed rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 24px; }

    /* Sticky Notes */
    .notes-section { width: 100%; margin-top: 26px; }
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .note-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 38px; position: relative; }
    .note-card:active { background: var(--surface-hover); transform: scale(0.97); }
    .note-card-title { font-size: 11px; font-weight: 500; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
    .note-edit-icon { position: absolute; bottom: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: all 0.2s; }
    .note-edit-icon:active { background: rgba(255,255,255,0.15); color: var(--text-primary); }
    .note-add-btn { border: 1.5px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); cursor: pointer; min-height: 38px; }

    /* Sheets */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(10px); display: flex; align-items: flex-end; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; }
    .sheet-backdrop.open { opacity: 1; pointer-events: all; }
    .sheet { background: #181818; border: 1px solid var(--border); border-radius: 24px 24px 0 0; width: 100%; max-height: 92svh; padding: 20px 18px calc(var(--safe-bot) + 20px); display: flex; flex-direction: column; gap: 14px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.22,1,0.36,1); }
    .sheet-backdrop.open .sheet { transform: translateY(0); }
    .sheet-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin: 0 auto 8px; flex-shrink: 0; }
    .sheet-title { font-size: 17px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
    
    .sc-field { display: flex; flex-direction: column; gap: 6px; }
    .sc-label { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-dim); font-weight: 400; }
    .sc-input { width: 100%; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-primary); font-size: 16px; outline: none; caret-color: var(--accent); }
    .sc-preview-row { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); }
    .sc-preview-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
    .sc-preview-icon img { width: 26px; height: 26px; object-fit: contain; border-radius: 4px; }
    .sc-preview-letter { font-size: 20px; font-weight: 500; color: var(--text-primary); text-transform: uppercase; }
    .sc-preview-info { display: flex; flex-direction: column; gap: 2px; }
    .sc-preview-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .sc-preview-url { font-size: 11px; color: var(--text-muted); word-break: break-all; }

    .btn { height: 50px; border-radius: 14px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.12s; flex: 1; display: flex; align-items: center; justify-content: center; }
    .btn-apply { background: rgba(138,180,248,0.18); color: var(--accent); border: 1px solid rgba(138,180,248,0.28); }
    .btn-cancel { background: rgba(255,255,255,0.07); color: var(--text-muted); }
    .btn-apply:active { transform: scale(0.97); background: rgba(138,180,248,0.25); }

    .toast { position: fixed; bottom: calc(var(--safe-bot) + 28px); left: 50%; transform: translateX(-50%) translateY(16px); background: rgba(28,28,28,0.96); border: 1px solid var(--border); color: var(--text-primary); font-size: 13px; padding: 10px 20px; border-radius: var(--pill); opacity: 0; transition: all 0.18s; z-index: 400; backdrop-filter: blur(10px); pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div id="wallpaperLayer"></div>
<div id="wallpaperDim"></div>

<button id="menuBtn" aria-label="Open menu">
  <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
</button>

<div id="dropMenu">
  <button class="drop-item" id="dropWallpaper">Change Wallpaper</button>
  <button class="drop-item" id="dropShortcuts">Edit Shortcuts</button>
  <button class="drop-item" id="dropSettings">Settings</button>
</div>

<div id="scrollRoot">
  <main class="page">
    <div class="clock-wrapper">
      <div class="clock" id="clock"><span id="hrs">12</span><span class="clock-sep">:</span><span id="mins">00</span><span class="clock-ampm" id="ampm">AM</span></div>
      <div class="date-label" id="date"></div>
      <div class="age-display" id="ageDisplay">Set Birthday</div>
    </div>

    <section class="search-section">
      <div class="engine-row" id="engineRow"></div>
      <div class="search-bar-wrap">
        <div class="search-badge"><div class="badge-icon" id="badgeIcon"></div><div class="badge-sep"></div></div>
        <input class="search-input" id="searchInput" type="search" placeholder="Search..." autocomplete="off" spellcheck="false">
        <button class="search-submit" id="searchSubmit">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </section>

    <section class="recent-section">
      <div class="section-header"><span class="section-label">Recent Searches</span><button class="section-clear" id="recentClearAll">Clear</button></div>
      <div class="recent-inline-list" id="recentInlineList"></div>
    </section>

    <section class="shortcuts-section">
      <div class="section-header"><span class="section-label">Shortcuts</span></div>
      <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </section>

    <section class="notes-section">
      <div class="section-header"><span class="section-label">Sticky Notes</span></div>
      <div class="notes-grid" id="notesGrid"></div>
    </section>
  </main>
</div>

<!-- Wallpaper Sheet -->
<div class="sheet-backdrop" id="wpBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Wallpaper</p>
    <div class="sc-field">
      <label class="sc-label">Image URL</label>
      <input class="sc-input" id="wpUrlInput" type="text" placeholder="https://example.com/image.jpg">
    </div>
    <div class="sheet-actions" style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-apply" id="wpApply">Apply</button>
    </div>
  </div>
</div>

<!-- Shortcut Sheet -->
<div class="sheet-backdrop" id="scBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Add Shortcut</p>
    <div class="sc-preview-row">
      <div class="sc-preview-icon" id="scPreviewIcon"><span class="sc-preview-letter">?</span></div>
      <div class="sc-preview-info">
        <div class="sc-preview-name" id="scPreviewName">New Shortcut</div>
        <div class="sc-preview-url" id="scPreviewUrl">—</div>
      </div>
    </div>
    <div class="sc-field"><label class="sc-label">URL</label><input class="sc-input" id="scUrlInput" type="text" placeholder="google.com"></div>
    <div class="sc-field"><label class="sc-label">Name (optional)</label><input class="sc-input" id="scNameInput" type="text" placeholder="Auto-detected"></div>
    <div class="sheet-actions" style="display:flex;gap:8px;"><button class="btn btn-apply" id="scSave">Save Shortcut</button></div>
  </div>
</div>

<!-- Note Sheet -->
<div class="sheet-backdrop" id="noteBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title" id="noteSheetTitle">Note</p>
    <div class="sc-field"><label class="sc-label">Title</label><input class="sc-input" id="noteTitleInput" type="text" placeholder="Title"></div>
    <div class="sc-field" style="flex:1;"><label class="sc-label">Content</label><textarea class="sc-input" id="noteTextInput" style="height:160px;resize:none;padding:14px;" placeholder="Content"></textarea></div>
    <div class="sheet-actions" style="display:flex;gap:8px;">
      <button class="btn btn-apply" style="background:rgba(255,80,80,0.1);color:var(--danger);border-color:rgba(255,80,80,0.2);" id="noteDelete">Delete</button>
      <button class="btn btn-apply" id="noteSave">Save</button>
    </div>
  </div>
</div>

<!-- Settings Sheet -->
<div class="sheet-backdrop" id="settingsBackdrop">
  <div class="sheet" style="overflow-y:auto;">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Settings</p>
    <div class="sc-field"><label class="sc-label">Birth Date</label><input class="sc-input" id="birthDateInput" type="datetime-local"></div>
    <div class="sc-field" style="margin-top:8px;"><label class="sc-label">Custom Engines</label><div id="settingsEngineList" style="display:flex;flex-direction:column;gap:6px;"></div></div>
    <div style="display:flex;gap:6px;">
      <input class="sc-input" id="newEngineName" placeholder="Name" style="flex:1;">
      <input class="sc-input" id="newEngineUrl" placeholder="URL" style="flex:2;">
      <button class="btn btn-apply" id="addEngineBtn" style="flex:0.6;height:48px;">Add</button>
    </div>
    <div class="sheet-actions" style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-apply" id="settingsSave">Save Settings</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAM6T2eWpeqBd5XzcQNa2SGtCsovn_BxAM",
    authDomain: "citric-143b9.firebaseapp.com",
    databaseURL: "https://citric-143b9-default-rtdb.firebaseio.com",
    projectId: "citric-143b9",
    storageBucket: "citric-143b9.firebasestorage.app",
    messagingSenderId: "75119245524",
    appId: "1:75119245524:web:d0006197a335457eb52341"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const sharedId = 'shared_dashboard';
  const shortcutsRef = ref(db, 'shortcuts/' + sharedId);
  const notesRef     = ref(db, 'notes/' + sharedId);
  const settingsRef  = ref(db, 'settings/' + sharedId);

  /* ══ Helpers ══ */
  const ensureArray = v => Array.isArray(v) ? v : (v ? Object.values(v) : []);
  const getFaviconUrl = url => { try { const u = new URL(url.replace('%s', 'g.com')); return `https://www.google.com/s2/favicons?sz=64&domain_url=${u.origin}`; } catch(e) { return ''; } };
  const nameFromUrl = url => { try { let h = new URL(url.includes('://') ? url : 'https://'+url).hostname; return h.replace('www.','').split('.')[0].replace(/^\w/, c => c.toUpperCase()); } catch(e) { return url; } };
  const showToast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); };

  /* ══ Clock ══ */
  const tick = () => {
    const now = new Date(), pm = now.getHours() >= 12;
    document.getElementById('hrs').textContent = String(now.getHours() % 12 || 12).padStart(2, '0');
    document.getElementById('mins').textContent = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('ampm').textContent = pm ? 'PM' : 'AM';
    document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
  };
  setInterval(tick, 1000); tick();

  /* ══ Sheets ══ */
  const openSheet = b => b.classList.add('open');
  const closeSheet = b => b.classList.remove('open');
  const setupDismiss = (id) => {
    const b = document.getElementById(id), s = b.querySelector('.sheet');
    b.onclick = e => { if(e.target === b) closeSheet(b); };
    let startY = 0;
    s.addEventListener('touchstart', e => startY = e.touches[0].clientY, {passive:true});
    s.addEventListener('touchmove', e => { let d = e.touches[0].clientY - startY; if(d > 0) s.style.transform = `translateY(${d}px)`; }, {passive:true});
    s.addEventListener('touchend', e => { let d = e.changedTouches[0].clientY - startY; s.style.transform = ''; if(d > 100) closeSheet(b); }, {passive:true});
  };
  ['wpBackdrop', 'scBackdrop', 'noteBackdrop', 'settingsBackdrop'].forEach(setupDismiss);

  /* ══ Wallpaper ══ */
  const applyWall = url => {
    if(!url) return;
    const l = document.getElementById('wallpaperLayer'), d = document.getElementById('wallpaperDim');
    const img = new Image(); img.src = url;
    img.onload = () => { l.style.backgroundImage = `url(${url})`; l.classList.add('loaded'); d.classList.add('loaded'); };
    localStorage.setItem('wp', url);
  };
  applyWall(localStorage.getItem('wp'));
  document.getElementById('dropWallpaper').onclick = () => openSheet(document.getElementById('wpBackdrop'));
  document.getElementById('wpApply').onclick = () => { applyWall(document.getElementById('wpUrlInput').value); closeSheet(document.getElementById('wpBackdrop')); };

  /* ══ Search & Engines ══ */
  let ENGINES = { google: { label:'Google', url:'https://www.google.com/search?q=%s' } };
  let activeEngine = localStorage.getItem('engine_key') || 'google';
  const engineRow = document.getElementById('engineRow'), badgeIcon = document.getElementById('badgeIcon'), sInput = document.getElementById('searchInput');
  
  const renderEngines = () => {
    engineRow.innerHTML = '';
    Object.entries(ENGINES).forEach(([k, e]) => {
      const b = document.createElement('button');
      b.className = 'engine-btn' + (k === activeEngine ? ' active' : '');
      const icon = e.svg || `<img src="${getFaviconUrl(e.url)}">`;
      b.innerHTML = `<span class="eng-icon">${icon}</span><span>${e.label}</span>`;
      b.onclick = () => setEngine(k);
      engineRow.appendChild(b);
    });
  };
  const setEngine = k => {
    if(!ENGINES[k]) k = 'google';
    activeEngine = k; localStorage.setItem('engine_key', k);
    const e = ENGINES[k];
    badgeIcon.innerHTML = e.svg || `<img src="${getFaviconUrl(e.url)}">`;
    sInput.placeholder = `Search ${e.label}...`;
    renderEngines();
  };

  const doSearch = () => {
    let q = sInput.value.trim(); if(!q) return;
    addRecent(q);
    if(/^https?:\/\//i.test(q) || (!q.includes(' ') && q.includes('.'))) {
      window.location.href = q.includes('://') ? q : 'https://' + q;
    } else {
      window.location.href = ENGINES[activeEngine].url.replace('%s', encodeURIComponent(q));
    }
  };
  document.getElementById('searchSubmit').onclick = doSearch;
  sInput.onkeydown = e => { if(e.key === 'Enter') doSearch(); };

  /* ══ Recent ══ */
  const renderRecent = () => {
    const list = document.getElementById('recentInlineList'), items = JSON.parse(localStorage.getItem('recent') || '[]');
    list.innerHTML = items.length ? '' : '<div style="padding:16px;text-align:center;color:var(--text-dim);font-size:12px;">No recent searches</div>';
    items.forEach(q => {
      const el = document.createElement('div'); el.className = 'recent-inline-item';
      el.innerHTML = `<span class="recent-inline-text">${q}</span>`;
      el.onclick = () => { sInput.value = q; doSearch(); };
      list.appendChild(el);
    });
  };
  const addRecent = q => {
    let arr = JSON.parse(localStorage.getItem('recent') || '[]').filter(i => i !== q);
    arr.unshift(q); localStorage.setItem('recent', JSON.stringify(arr.slice(0, 5)));
    renderRecent();
  };
  document.getElementById('recentClearAll').onclick = () => { localStorage.setItem('recent', '[]'); renderRecent(); };

  /* ══ Shortcuts ══ */
  const grid = document.getElementById('shortcutsGrid'), scUrl = document.getElementById('scUrlInput'), scName = document.getElementById('scNameInput');
  const pIcon = document.getElementById('scPreviewIcon'), pName = document.getElementById('scPreviewName'), pUrl = document.getElementById('scPreviewUrl');
  let scList = [], scEditMode = false;

  onValue(shortcutsRef, s => { scList = ensureArray(s.val()); renderShortcuts(); });
  
  const updateScPreview = () => {
    let url = scUrl.value.trim(); if(!url) { pIcon.innerHTML = '?'; pName.textContent = 'New Shortcut'; pUrl.textContent = '—'; return; }
    let clean = url.includes('://') ? url : 'https://' + url;
    pName.textContent = scName.value.trim() || nameFromUrl(url); pUrl.textContent = clean;
    pIcon.innerHTML = `<img src="${getFaviconUrl(clean)}" onerror="this.parentElement.innerHTML='<span class=\"sc-preview-letter\">${pName.textContent[0]}</span>'">`;
  };
  scUrl.oninput = scName.oninput = updateScPreview;

  const renderShortcuts = () => {
    grid.innerHTML = '';
    scList.forEach((sc, i) => {
      const item = document.createElement('div'); item.className = 'shortcut-item';
      item.innerHTML = `<div class="shortcut-icon"><img src="${getFaviconUrl(sc.url)}"></div><div class="shortcut-del-btn">&times;</div><div class="shortcut-label">${sc.name || nameFromUrl(sc.url)}</div>`;
      item.onclick = () => { if(scEditMode) return; let t = sc.url.trim(); window.location.href = t.includes('://') ? t : 'https://' + t; };
      item.querySelector('.shortcut-del-btn').onclick = e => { e.stopPropagation(); scList.splice(i,1); set(shortcutsRef, scList); };
      let timer;
      item.onpointerdown = () => timer = setTimeout(() => { scEditMode = true; grid.classList.add('edit-mode'); }, 600);
      item.onpointerup = item.onpointercancel = () => clearTimeout(timer);
      grid.appendChild(item);
    });
    const add = document.createElement('div'); add.className = 'shortcut-item'; add.innerHTML = '<div class="shortcut-icon shortcut-add-icon">+</div><div class="shortcut-label">Add</div>';
    add.onclick = () => { if(scEditMode) return; scUrl.value = scName.value = ''; updateScPreview(); openSheet(document.getElementById('scBackdrop')); };
    grid.appendChild(add);
  };
  document.getElementById('scSave').onclick = () => {
    let url = scUrl.value.trim(); if(!url) return;
    scList.push({ url: url.includes('://') ? url : 'https://' + url, name: scName.value.trim() });
    set(shortcutsRef, scList); closeSheet(document.getElementById('scBackdrop'));
  };
  document.addEventListener('click', e => { if(scEditMode && !grid.contains(e.target) && !document.getElementById('menuBtn').contains(e.target)) { scEditMode = false; grid.classList.remove('edit-mode'); } });

  /* ══ Notes ══ */
  const nGrid = document.getElementById('notesGrid');
  let nList = [], nIdx = -1;
  onValue(notesRef, s => { nList = ensureArray(s.val()); renderNotes(); });
  const renderNotes = () => {
    nGrid.innerHTML = '';
    nList.forEach((n, i) => {
      const c = document.createElement('div'); c.className = 'note-card';
      c.innerHTML = `<div class="note-card-title">${n.title || 'Note'}</div><div class="note-edit-icon"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>`;
      c.onclick = () => { if(n.text) navigator.clipboard.writeText(n.text).then(() => showToast('Copied!')); else showToast('Empty note'); };
      c.querySelector('.note-edit-icon').onclick = e => { e.stopPropagation(); nIdx = i; document.getElementById('noteTitleInput').value = n.title; document.getElementById('noteTextInput').value = n.text; document.getElementById('noteSheetTitle').textContent = 'Edit Note'; openSheet(document.getElementById('noteBackdrop')); };
      nGrid.appendChild(c);
    });
    const add = document.createElement('div'); add.className = 'note-add-btn'; add.innerHTML = '+';
    add.onclick = () => { nIdx = -1; document.getElementById('noteTitleInput').value = document.getElementById('noteTextInput').value = ''; document.getElementById('noteSheetTitle').textContent = 'New Note'; openSheet(document.getElementById('noteBackdrop')); };
    nGrid.appendChild(add);
  };
  document.getElementById('noteSave').onclick = () => {
    const t = document.getElementById('noteTitleInput').value, x = document.getElementById('noteTextInput').value;
    if(nIdx >= 0) nList[nIdx] = { title:t, text:x }; else nList.push({ title:t, text:x });
    set(notesRef, nList); closeSheet(document.getElementById('noteBackdrop'));
  };
  document.getElementById('noteDelete').onclick = () => { if(nIdx >= 0) nList.splice(nIdx,1); set(notesRef, nList); closeSheet(document.getElementById('noteBackdrop')); };

  /* ══ Settings ══ */
  let bDay = null;
  onValue(settingsRef, s => {
    const d = s.val() || {};
    if(d.birthDate) { bDay = new Date(d.birthDate); document.getElementById('birthDateInput').value = d.birthDate; }
    if(d.engines) { ENGINES = { google: ENGINES.google, ...d.engines }; setEngine(activeEngine); }
  });
  setInterval(() => {
    if(!bDay) return;
    let diff = new Date() - bDay, years = diff / 31557600000, y = Math.floor(years), d = Math.floor((years-y)*365.25), h = Math.floor(((years-y)*365.25-d)*24), m = Math.floor((((years-y)*365.25-d)*24-h)*60), s = Math.floor(((((years-y)*365.25-d)*24-h)*60-m)*60);
    document.getElementById('ageDisplay').textContent = `${y}y ${d}d ${h}h ${m}m ${s}s`;
  }, 1000);

  document.getElementById('dropSettings').onclick = () => {
    const list = document.getElementById('settingsEngineList'); list.innerHTML = '';
    Object.entries(ENGINES).forEach(([k, e]) => {
      if(k === 'google') return;
      const row = document.createElement('div'); row.style = 'display:flex;justify-content:space-between;padding:8px;background:var(--surface);border-radius:8px;font-size:13px;';
      row.innerHTML = `<span>${e.label}</span><span style="color:var(--danger);cursor:pointer;">Delete</span>`;
      row.querySelector('span:last-child').onclick = () => { delete ENGINES[k]; document.getElementById('dropSettings').click(); };
      list.appendChild(row);
    });
    openSheet(document.getElementById('settingsBackdrop'));
  };
  document.getElementById('addEngineBtn').onclick = () => {
    const name = document.getElementById('newEngineName').value.trim(), url = document.getElementById('newEngineUrl').value.trim();
    if(name && url) { ENGINES[name.toLowerCase()] = { label: name, url: url }; document.getElementById('newEngineName').value = document.getElementById('newEngineUrl').value = ''; document.getElementById('dropSettings').click(); }
  };
  document.getElementById('settingsSave').onclick = () => { set(settingsRef, { birthDate: document.getElementById('birthDateInput').value, engines: ENGINES }); closeSheet(document.getElementById('settingsBackdrop')); };
  document.getElementById('settingsClose').onclick = () => closeSheet(document.getElementById('settingsBackdrop'));

  /* ══ Init ══ */
  document.getElementById('menuBtn').onclick = () => document.getElementById('dropMenu').classList.toggle('open');
  document.getElementById('dropShortcuts').onclick = () => { scEditMode = true; grid.classList.add('edit-mode'); document.getElementById('dropMenu').classList.remove('open'); };
  renderRecent(); setEngine(activeEngine);
</script>
</body>
</html>
